name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Regenerate iOS platform
      run: |
        rm -rf ios
        npx cap add ios
        npx cap sync ios

    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install

    - name: Build iOS
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ENTITLEMENTS=""

    - name: Package IPA
      run: |
        mkdir Payload
        cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r huogugu.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: huogugu-ipa
        path: huogugu.ipa