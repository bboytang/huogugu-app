name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Add iOS platform
      run: npx cap add ios

    - name: Inject URL Scheme and Plugin
      run: |
        # 1. 修改 Info.plist 添加 URL Scheme
        PLIST="ios/App/App/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string 'com.huogugu.app'" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string 'huogugu'" "$PLIST" || true

        # 2. 创建 Swift 插件
        cat > ios/App/App/HuoguguPlugin.swift << 'SWIFT_EOF'
        import Foundation
        import Capacitor

        @objc(HuoguguPlugin)
        public class HuoguguPlugin: CAPPlugin, CAPBridgedPlugin {
            public let identifier = "HuoguguPlugin"
            public let jsName = "Huogugu"
            public let pluginMethods: [CAPPluginMethod] = [
                CAPPluginMethod(name: "getLaunchUrl", returnType: CAPPluginReturnPromise)
            ]

            @objc func getLaunchUrl(_ call: CAPPluginCall) {
                if let url = AppDelegate.launchUrl {
                    call.resolve(["url": url])
                } else {
                    call.resolve(["url": ""])
                }
            }
        }
        SWIFT_EOF

        # 3. 修改 AppDelegate.swift
        cat > ios/App/App/AppDelegate.swift << 'SWIFT_EOF'
        import UIKit
        import Capacitor

        @UIApplicationMain
        class AppDelegate: UIResponder, UIApplicationDelegate {

            static var launchUrl: String?

            var window: UIWindow?

            func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey : Any] = [:]) -> Bool {
                AppDelegate.launchUrl = url.absoluteString
                return CAPBridge.handleOpenUrl(url, options)
            }

            override open func capacitorDidLoad() {
                bridge?.registerPluginInstance(HuoguguPlugin())
            }
        }
        SWIFT_EOF

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS
      run: |
        cd ios/App
        xcodebuild -project App.xcodeproj \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ENTITLEMENTS="" \
          -destination 'generic/platform=iOS'

    - name: Package IPA
      run: |
        mkdir Payload
        cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r huogugu.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: huogugu-ipa
        path: huogugu.ipa