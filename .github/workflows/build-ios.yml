name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Add iOS platform
      run: npx cap add ios

    - name: Inject URL Scheme into Info.plist
      run: |
        PLIST="ios/App/App/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string 'com.huogugu.app'" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string 'huogugu'" "$PLIST" || true

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ENTITLEMENTS="" \
          -destination 'generic/platform=iOS'

    - name: Package IPA
      run: |
        mkdir Payload
        cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r huogugu.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: huogugu-ipa
        path: huogugu.ipa